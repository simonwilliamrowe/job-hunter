name: Digesto diario de ofertas

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -q requests python-docx reportlab

      - name: Ejecutar bot (buscar → matchear → preparar → notificar)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot_daily.py

      - name: Guardar estado (ofertas ya vistas + aplicadas + descartadas)
        continue-on-error: true
        run: |
          git config user.name "Job Hunter Bot"
          git config user.email "jobhunter-bot@users.noreply.github.com"
          git add data/seen.json data/applied.json data/dismissed.json data/last_briefing.json data/telegram_offset.txt
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado"
          else
            git commit -m "Actualizar estado [bot]"
            git push
          fi
