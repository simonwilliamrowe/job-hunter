name: Digesto diario de ofertas

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

# Permisos necesarios para que el bot pueda commitear y pushear
permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
        with:
          # Importante: traer el historial completo para poder hacer pull/rebase
          fetch-depth: 0
          # Persistir credenciales para el push
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -q requests python-docx reportlab

      - name: Ejecutar bot (buscar → matchear → preparar → notificar)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot_daily.py

      # Step MEJORADO: en vez de un git push directo que puede fallar
      # silenciosamente, usamos un script que:
      # 1) Hace pull --rebase antes de push (por si hay commits externos)
      # 2) Muestra logs detallados de error
      # 3) Reintenta una vez si falla
      - name: Guardar estado (ofertas ya vistas + aplicadas + descartadas)
        run: |
          set -e  # salir si hay error
          git config user.name "Job Hunter Bot"
          git config user.email "jobhunter-bot@users.noreply.github.com"

          echo "=== Archivos de estado actuales en el repo ==="
          ls -la data/ || true

          # Asegurar que todos los archivos existen (pueden no existir en
          # el repo si es la primera vez que se aplican/descartan)
          touch data/seen.json data/applied.json data/dismissed.json data/last_briefing.json data/telegram_offset.txt

          # Si applied.json o dismissed.json están vacíos, inicializarlos como []
          if [ ! -s data/seen.json ]; then
            echo '{"ids": []}' > data/seen.json
          fi
          if [ ! -s data/applied.json ]; then
            echo '[]' > data/applied.json
          fi
          if [ ! -s data/dismissed.json ]; then
            echo '[]' > data/dismissed.json
          fi
          if [ ! -s data/last_briefing.json ]; then
            echo '[]' > data/last_briefing.json
          fi

          git add data/seen.json data/applied.json data/dismissed.json data/last_briefing.json data/telegram_offset.txt

          if git diff --cached --quiet; then
            echo "=== Sin cambios en el estado ==="
            exit 0
          fi

          echo "=== Cambios a commitear ==="
          git diff --cached --stat

          git commit -m "Actualizar estado [bot] $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Pull --rebase para evitar conflictos con "Add files via upload"
          echo "=== Haciendo pull --rebase ==="
          git pull --rebase --autostash || {
            echo "⚠️  Pull --rebase falló, intentando push forzado"
            git push --force-with-lease || {
              echo "❌ Push falló completamente"
              exit 1
            }
          }

          echo "=== Push final ==="
          git push origin HEAD:main
          echo "✅ Estado guardado correctamente en el repo"
